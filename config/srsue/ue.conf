[rf]
device_name = zmq
device_args = tx_port=tcp://*:2001,rx_port=tcp://10.53.1.5:2000,id=ue,base_srate=23.04e6
srate = 23.04e6
tx_gain = 75
rx_gain = 75

[rat.eutra]
nof_carriers = 0

[rat.nr]
bands = 3
nof_carriers = 1
dl_nr_arfcn = 368500
ssb_nr_arfcn = 368410
nof_prb = 106
max_nof_prb = 106
scs = 15
ssb_scs = 15

[usim]
mode = soft
algo = milenage
imsi = 001010000000001
imei = 353490069873319

[nas]
apn = Metodos1
apn_protocol = ipv4

[slicing]
enable = true
nssai-sst = 1
# srsUE usa cero para omitir SD en el mensaje NAS.
nssai-sd = 0

[rrc]
release = 15

[log]
all_level = info
all_hex_limit = 0
filename = /tmp/ue.log

[pcap]
enable = none

[gui]
enable = false
