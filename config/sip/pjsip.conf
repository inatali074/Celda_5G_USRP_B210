[global]
type=global
endpoint_identifier_order=username

[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060

; Redmi Note 14. Identificar por usuario: ambos teléfonos comparten NAT.
[1001]
type=endpoint
transport=transport-udp
context=internos
disallow=all
allow=alaw,ulaw
auth=auth-1001
aors=1001
identify_by=username
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes
direct_media=no

[1001]
type=aor
max_contacts=1
remove_existing=yes
qualify_frequency=30

; OnePlus 13.
[1002]
type=endpoint
transport=transport-udp
context=internos
disallow=all
allow=alaw,ulaw
auth=auth-1002
aors=1002
identify_by=username
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes
direct_media=no

[1002]
type=aor
max_contacts=1
remove_existing=yes
qualify_frequency=30

