# Núcleo con PLMN 001/01: prueba ZMQ con srsUE (MNC de 2 dígitos en usim.cc) y prueba con celulares. Igual a open5gs-5gc.yml salvo el PLMN.
# SBI y PFCP usan loopback dentro del único contenedor 5GC.
db_uri: mongodb://10.53.1.4/open5gs
logger:
  level: info
global:
  parameter:
    no_ipv6: true
    no_sepp: true
    no_mme: true
    no_sgwc: true
    no_sgwu: true
    no_hss: true
    no_pcrf: true
smf:
  sbi:
    server:
    - address: 127.0.0.4
      port: 7777
    client:
      scp:
      - uri: http://127.0.0.22:7777
  pfcp:
    server:
    - address: 127.0.0.4
    client:
      upf:
      - address: 127.0.0.7
  gtpc:
    server:
    - address: 127.0.0.4
  gtpu:
    server:
    - address: 127.0.0.4
  metrics:
    server:
    - address: 127.0.0.4
      port: 9090
  session:
  - subnet: 10.45.0.0/16
    gateway: 10.45.0.1
    dnn: Metodos1
  dns:
  - 8.8.8.8
  - 8.8.4.4
  mtu: 1400
  info:
  - s_nssai:
    - sst: 1
      dnn:
      - Metodos1
amf:
  sbi:
    server:
    - address: 127.0.0.5
      port: 7777
    client:
      scp:
      - uri: http://127.0.0.22:7777
  ngap:
    server:
    - address: 10.53.1.2
  guami:
  - plmn_id:
      mcc: '001'
      mnc: '01'
    amf_id:
      region: 2
      set: 1
  tai:
  - plmn_id:
      mcc: '001'
      mnc: '01'
    tac: 7
  plmn_support:
  - plmn_id:
      mcc: '001'
      mnc: '01'
    s_nssai:
    - sst: 1
  security:
    integrity_order:
    - NIA2
    - NIA1
    - NIA0
    ciphering_order:
    - NEA2
    - NEA1
    - NEA0
  network_name:
    full: Metodos1
    short: Metodos1
  amf_name: open5gs-amf0
  time:
    t3512:
      value: 540
upf:
  pfcp:
    server:
    - address: 127.0.0.7
  gtpu:
    server:
    - address: 10.53.1.2
  session:
  - subnet: 10.45.0.0/16
    gateway: 10.45.0.1
    dnn: Metodos1
nrf:
  sbi:
    server:
    - address: 127.0.0.10
      port: 7777
  serving:
  - plmn_id:
      mcc: '001'
      mnc: '01'
scp:
  sbi:
    server:
    - address: 127.0.0.22
      port: 7777
    client:
      nrf:
      - uri: http://127.0.0.10:7777
ausf:
  sbi:
    server:
    - address: 127.0.0.11
      port: 7777
    client:
      scp:
      - uri: http://127.0.0.22:7777
udm:
  sbi:
    server:
    - address: 127.0.0.12
      port: 7777
    client:
      scp:
      - uri: http://127.0.0.22:7777
pcf:
  sbi:
    server:
    - address: 127.0.0.13
      port: 7777
    client:
      scp:
      - uri: http://127.0.0.22:7777
  metrics:
    server:
    - address: 127.0.0.13
      port: 9090
nssf:
  sbi:
    server:
    - address: 127.0.0.14
      port: 7777
