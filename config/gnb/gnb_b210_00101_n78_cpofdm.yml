# Basada en el ejemplo oficial de OCUDU para B210 (TDD n78 o FDD n3, 20 MHz).
# n78 TDD, subida CP-OFDM.
# Métricas JSON y volcado IQ: crece sin límite mientras haya subida.
# Al terminar, borrar /tmp/gnb_rx_symbols.bin del volumen gnb-logs.

cu_cp:
  amf:
    addrs: 10.53.1.2
    port: 38412
    bind_addrs: 10.53.1.3
    supported_tracking_areas:
      - tac: 7
        plmn_list:
          - plmn: '00101'
            tai_slice_support_list:
              - sst: 1

cu_up:
  ngu:
    socket:
      - bind_addr: 10.53.1.3

ru_sdr:
  device_driver: uhd
  device_args: type=b200
  srate: 23.04
  otw_format: sc12
  # Jaula de Faraday a corta distancia; ajustar según medición.
  tx_gain: 80
  rx_gain: 40
  # Prueba 2026-11-03: sin correccion. En OCUDU clock_ppm solo corrige la portadora, no el muestreo (ru_sdr_config_translator.cpp); ver investigacion/2026-11-03_analisis-cortes-claude.md
  clock_ppm: 0

cell_cfg:
  dl_arfcn: 635000  # 3525 MHz; n78, raster de 30 kHz.
  band: 78
  channel_bandwidth_MHz: 20
  common_scs: 30
  plmn: '00101'
  tac: 7
  pci: 1
  # CSI por defecto de OCUDU: CSI-RS (incluye TRS) y reportes periodicos por PUCCH formato 2.
  # Prueba 2026-11-03: el Redmi no envia CSI por PUCCH F2; umbral alto para que el CSI faltante no dispare RLF (OCUDU: configure_cli11_pucch_args).
  pucch:
    max_consecutive_kos: 100000
  pusch:
    enable_transform_precoding: false

# Compensar el CFO del reloj de la USRP en el estimador de canal.
expert_phy:
  pusch_channel_estimator_td_strategy: average
  pusch_channel_estimator_cfo_compensation: true

log:
  phy_rx_symbols_filename: /tmp/gnb_rx_symbols.bin
  phy_rx_symbols_port: 0
  phy_rx_symbols_pusch_threshold_sinr_dB: 100
  filename: /tmp/gnb.log
  all_level: info

pcap:
  mac_enable: false
  mac_filename: /tmp/gnb_mac.pcap
  ngap_enable: false
  ngap_filename: /tmp/gnb_ngap.pcap

# Monitoreo interno de la red ran; no publica el control remoto al host.
remote_control:
  enabled: true
  bind_addr: 0.0.0.0
  port: 8001

metrics:
  enable_json: true
  periodicity:
    du_report_period: 1000
  layers:
    enable_sched: true
    enable_sched_ue: true
