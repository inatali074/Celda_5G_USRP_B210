# Variante sin remote_control ni métricas JSON, para PCs con poca CPU (tachoPC, 4 hilos), para comparar
# las fallas «UL processor is busy» observadas con métricas el 2026-11-03; el dashboard sigue funcionando pero sin tabla de radio.
