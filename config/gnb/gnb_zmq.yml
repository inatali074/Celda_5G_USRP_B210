# n3 FDD: srsUE rechaza SCS común distinto de 15 kHz; esta prueba no fija la banda de RF.
# PDCCH conserva los ajustes del ejemplo oficial para srsUE; transform precoding queda desactivado por defecto.
cu_cp:
  amf:
    addrs: 10.53.1.2
    port: 38412
    bind_addrs: 10.53.1.5
    supported_tracking_areas:
    - tac: 7
      plmn_list:
      - plmn: '00101'
        tai_slice_support_list:
        - sst: 1
ru_sdr:
  device_driver: zmq
  device_args: tx_port=tcp://*:2000,rx_port=tcp://10.53.1.6:2001,base_srate=23.04e6
  srate: 23.04
  # Por ZMQ no hay radio: la ganancia es de canal y debe ser <= 0 dB.
  tx_gain: 0
  rx_gain: 0
cell_cfg:
  dl_arfcn: 368500
  band: 3
  channel_bandwidth_MHz: 20
  common_scs: 15
  plmn: '00101'
  tac: 7
  pdcch:
    dedicated:
      ss2_type: common
      dci_format_0_1_and_1_1: false
    common:
      ss0_index: 0
      coreset0_index: 12
  prach:
    prach_config_index: 1
  pdsch:
    mcs_table: qam64
  pusch:
    mcs_table: qam64
  pci: 1
log:
  filename: stdout
  all_level: info
  radio_level: debug
pcap:
  mac_enable: false
  ngap_enable: false
cu_up:
  ngu:
    socket:
    - bind_addr: 10.53.1.5
