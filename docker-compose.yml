# Nombre fijo: los scripts usan los contenedores 5g-*, sin importar cómo se llame la carpeta.
name: 5g

services:
  mongodb:
    image: mongo:6.0
    volumes:
      - mongodb-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "quit(db.adminCommand({ping: 1}).ok ? 0 : 1)"]
      interval: 5s
      timeout: 5s
      retries: 30
    networks:
      ran:
        ipv4_address: 10.53.1.4

  open5gs:
    ports:
      - "127.0.0.1:8080:8080"
    # Sin terminal, 5gc retiene su salida y se pierde si el proceso termina con error.
    tty: true
    build:
      context: ./docker/open5gs
      args:
        OPEN5GS_TAG: v2.8.0
        OPEN5GS_COMMIT: 157f611a530e292e40ec50f9d23f0ef5d4fcd6a6
        NUM_JOBS: "2"
    depends_on:
      mongodb:
        condition: service_healthy
    cap_add: [NET_ADMIN]
    devices:
      - /dev/net/tun:/dev/net/tun
    sysctls:
      net.ipv4.ip_forward: "1"
    # Referencia: pool UE 10.45.0.0/16, ogstun 10.45.0.1/16; valores reales en config/.
    env_file:
      - ./config/open5gs/network.env
    command: ["5gc", "-c", "/config/${OPEN5GS_CONFIG:-open5gs-5gc.yml}"]
    # Espera al NRF (SBI :7777), como el compose oficial, para que el gNB no corra antes que el núcleo.
    healthcheck:
      test: ["CMD-SHELL", "ss -ltn | grep -q ':7777'"]
      interval: 3s
      timeout: 2s
      retries: 60
    volumes:
      - core-logs:/var/log/open5gs
      - type: bind
        source: ./config/open5gs
        target: /config
        read_only: true
        bind:
          create_host_path: false
    networks:
      ran:
        ipv4_address: 10.53.1.2

  dashboard:
    build: ./docker/dashboard
    network_mode: "service:open5gs"
    depends_on:
      open5gs:
        condition: service_healthy
    # ping usa sockets raw si el kernel no permite sockets ICMP de datagrama.
    cap_drop: [ALL]
    cap_add: [NET_RAW]
    security_opt: [no-new-privileges:true]
    volumes:
      - gnb-logs:/logs/gnb:ro
      - core-logs:/logs/core:ro
      - type: bind
        source: ./config/gnb/${GNB_CONFIG:-gnb_b210.yml}
        target: /config/gnb.yml
        read_only: true
        bind:
          create_host_path: false
    environment:
      GNB_CONFIG: ${GNB_CONFIG:-gnb_b210.yml}

  gnb-radio:
    profiles: [radio]
    tty: true
    stdin_open: true
    restart: 'no'
    build: &gnb-build
      context: ./docker/gnb
      args:
        OCUDU_TAG: release_26_10
        OCUDU_COMMIT: e0db566aac6e6376ddd60e83c84f58698fcc4d70
        UHD_VERSION: 4.9.0.1
        MARCH: x86-64-v3
        NUM_JOBS: "2"
    depends_on:
      open5gs:
        condition: service_healthy
    cap_add: [SYS_NICE]
    # Plan B, solo tras evaluar el acceso USB restringido: privileged: true
    device_cgroup_rules:
      - 'c 189:* rwm'
    ulimits:
      rtprio: 99
      memlock: -1
    volumes:
      - gnb-logs:/tmp
      - /dev/bus/usb:/dev/bus/usb
      - type: bind
        source: ./config/gnb/${GNB_CONFIG:-gnb_b210.yml}
        target: /config/gnb.yml
        read_only: true
        bind:
          create_host_path: false
    # Conserva argv, stdin y señales: sh se reemplaza por el gNB.
    entrypoint: ["/bin/sh", "-ec", ": > /tmp/gnb.log; exec /usr/local/bin/gnb \"$$@\"", "gnb"]
    command: ["-c", "/config/gnb.yml"]
    networks:
      ran:
        ipv4_address: 10.53.1.3

  gnb-zmq:
    profiles: [zmq]
    # El gNB y srsUE leen comandos de stdin; sin terminal fallan y retienen su salida.
    tty: true
    stdin_open: true
    restart: 'no'
    build: *gnb-build
    depends_on:
      open5gs:
        condition: service_healthy
    cap_add: [SYS_NICE]
    ulimits:
      rtprio: 99
      memlock: -1
    volumes:
      - type: bind
        source: ./config/gnb/gnb_zmq.yml
        target: /config/gnb.yml
        read_only: true
        bind:
          create_host_path: false
    command: ["-c", "/config/gnb.yml"]
    networks:
      ran:
        ipv4_address: 10.53.1.5

  srsue:
    profiles: [zmq]
    # El gNB y srsUE leen comandos de stdin; sin terminal fallan y retienen su salida.
    tty: true
    stdin_open: true
    restart: 'no'
    build:
      context: ./docker/srsue
      args:
        SRSRAN_TAG: release_25_10
        SRSRAN_COMMIT: 6bcbd9e5bf8686aa7085202cd847c5ddd64a9c16
        MARCH: x86-64-v3
        NUM_JOBS: "2"
    depends_on:
      gnb-zmq:
        condition: service_started
    cap_add: [NET_ADMIN, SYS_NICE]
    ulimits:
      rtprio: 99
      memlock: -1
    devices:
      - /dev/net/tun:/dev/net/tun
    volumes:
      - type: bind
        source: ./config/srsue
        target: /config
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./config/secretos
        target: /run/secretos
        read_only: true
        bind:
          create_host_path: false
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        . /run/secretos/usim.env
        : "$${USIM_K:?Falta USIM_K en usim.env}"
        : "$${USIM_OPC:?Falta USIM_OPC en usim.env}"
        # srsUE escribe sus argumentos en el log: las claves van en un archivo temporal, no en argv.
          umask 077
          sed "/^\\[usim\\]/a k = $${USIM_K}\\nopc = $${USIM_OPC}" /config/ue.conf >/tmp/ue.conf
          exec srsue /tmp/ue.conf
    networks:
      ran:
        ipv4_address: 10.53.1.6

volumes:
  mongodb-data:
  gnb-logs:
  core-logs:

# N2 (SCTP/38412) y N3 (UDP/2152) circulan por esta red sin publicar puertos.
# Las configuraciones deben usar estas IP; comprobar que la subred no se superponga con el host.
networks:
  ran:
    driver: bridge
    ipam:
      config:
        - subnet: 10.53.1.0/24
