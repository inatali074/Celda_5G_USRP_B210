# Nombre fijo: los scripts usan los contenedores 5g-*, sin importar cómo se llame la carpeta.
name: 5g

services:
  mongodb:
    image: mongo:6.0
    volumes:
      - mongodb-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "quit(db.adminCommand({ping: 1}).ok ? 0 : 1)"]
      interval: 5s
      timeout: 5s
      retries: 30
    networks:
      ran:
        ipv4_address: 10.53.1.4

  open5gs:
    ports:
      - "127.0.0.1:8080:8080"
    # Sin terminal, 5gc retiene su salida y se pierde si el proceso termina con error.
    tty: true
    build:
      context: ./docker/open5gs
      args:
        OPEN5GS_TAG: v2.8.0
        OPEN5GS_COMMIT: 157f611a530e292e40ec50f9d23f0ef5d4fcd6a6
        NUM_JOBS: "2"
    depends_on:
      mongodb:
        condition: service_healthy
    cap_add: [NET_ADMIN]
    devices:
      - /dev/net/tun:/dev/net/tun
    sysctls:
      net.ipv4.ip_forward: "1"
    # Referencia: pool UE 10.45.0.0/16, ogstun 10.45.0.1/16; valores reales en config/.
    env_file:
      - ./config/open5gs/network.env
    environment:
      IMS_SUBNET: ${IMS_SUBNET:-}
      OGSTUN2_ADDRESS: ${OGSTUN2_ADDRESS:-}
    command: ["5gc", "-c", "/config/${OPEN5GS_CONFIG:-open5gs-5gc-zmq.yml}"]
    # Espera al NRF (SBI :7777), como el compose oficial, para que el gNB no corra antes que el núcleo.
    healthcheck:
      test: ["CMD-SHELL", "ss -ltn | grep -q ':7777'"]
      interval: 3s
      timeout: 2s
      retries: 60
    volumes:
      - core-logs:/var/log/open5gs
      - type: bind
        source: ./config/open5gs
        target: /config
        read_only: true
        bind:
          create_host_path: false
    networks:
      ran:
        ipv4_address: 10.53.1.2

      ims:
        ipv4_address: 10.53.2.2

  dashboard:
    build: ./docker/dashboard
    network_mode: "service:open5gs"
    depends_on:
      open5gs:
        condition: service_healthy
    # ping usa sockets raw si el kernel no permite sockets ICMP de datagrama.
    cap_drop: [ALL]
    cap_add: [NET_RAW]
    security_opt: [no-new-privileges:true]
    volumes:
      - gnb-logs:/logs/gnb:ro
      - core-logs:/logs/core:ro
      - type: bind
        source: ./config/gnb/${GNB_CONFIG:-gnb_b210_00101_n78_cpofdm.yml}
        target: /config/gnb.yml
        read_only: true
        bind:
          create_host_path: false
    environment:
      GNB_CONFIG: ${GNB_CONFIG:-gnb_b210_00101_n78_cpofdm.yml}

  gnb-radio:
    profiles: [radio]
    tty: true
    stdin_open: true
    restart: 'no'
    build: &gnb-build
      context: ./docker/gnb
      args:
        OCUDU_TAG: release_26_10
        OCUDU_COMMIT: e0db566aac6e6376ddd60e83c84f58698fcc4d70
        UHD_VERSION: 4.9.0.1
        MARCH: x86-64-v3
        NUM_JOBS: "2"
    depends_on:
      open5gs:
        condition: service_healthy
    cap_add: [SYS_NICE]
    # Plan B, solo tras evaluar el acceso USB restringido: privileged: true
    device_cgroup_rules:
      - 'c 189:* rwm'
    ulimits:
      rtprio: 99
      memlock: -1
    volumes:
      - gnb-logs:/tmp
      - /dev/bus/usb:/dev/bus/usb
      - type: bind
        source: ./config/gnb/${GNB_CONFIG:-gnb_b210_00101_n78_cpofdm.yml}
        target: /config/gnb.yml
        read_only: true
        bind:
          create_host_path: false
    # Conserva argv, stdin y señales: sh se reemplaza por el gNB.
    entrypoint: ["/bin/sh", "-ec", ": > /tmp/gnb.log; exec /usr/local/bin/gnb \"$$@\"", "gnb"]
    command: ["-c", "/config/gnb.yml"]
    networks:
      ran:
        ipv4_address: 10.53.1.3

  gnb-zmq:
    profiles: [zmq]
    # El gNB y srsUE leen comandos de stdin; sin terminal fallan y retienen su salida.
    tty: true
    stdin_open: true
    restart: 'no'
    build: *gnb-build
    depends_on:
      open5gs:
        condition: service_healthy
    cap_add: [SYS_NICE]
    ulimits:
      rtprio: 99
      memlock: -1
    volumes:
      - type: bind
        source: ./config/gnb/gnb_zmq.yml
        target: /config/gnb.yml
        read_only: true
        bind:
          create_host_path: false
    command: ["-c", "/config/gnb.yml"]
    networks:
      ran:
        ipv4_address: 10.53.1.5

  srsue:
    profiles: [zmq]
    # El gNB y srsUE leen comandos de stdin; sin terminal fallan y retienen su salida.
    tty: true
    stdin_open: true
    restart: 'no'
    build:
      context: ./docker/srsue
      args:
        SRSRAN_TAG: release_25_10
        SRSRAN_COMMIT: 6bcbd9e5bf8686aa7085202cd847c5ddd64a9c16
        MARCH: x86-64-v3
        NUM_JOBS: "2"
    depends_on:
      gnb-zmq:
        condition: service_started
    cap_add: [NET_ADMIN, SYS_NICE]
    ulimits:
      rtprio: 99
      memlock: -1
    devices:
      - /dev/net/tun:/dev/net/tun
    volumes:
      - type: bind
        source: ./config/srsue
        target: /config
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./config/secretos
        target: /run/secretos
        read_only: true
        bind:
          create_host_path: false
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        . /run/secretos/usim.env
        : "$${USIM_K:?Falta USIM_K en usim.env}"
        : "$${USIM_OPC:?Falta USIM_OPC en usim.env}"
        # srsUE escribe sus argumentos en el log: las claves van en un archivo temporal, no en argv.
          umask 077
          sed "/^\\[usim\\]/a k = $${USIM_K}\\nopc = $${USIM_OPC}" /config/ue.conf >/tmp/ue.conf
          exec srsue /tmp/ue.conf
    networks:
      ran:
        ipv4_address: 10.53.1.6

  sip:
    profiles: [voz]
    build: ./docker/sip
    restart: 'no'
    # La imagen usa USER asterisk: no necesita SETUID ni SETGID.
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    volumes:
      - type: bind
        source: ./config/sip/pjsip.conf
        target: /etc/asterisk/pjsip.conf
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./config/sip/extensions.conf
        target: /etc/asterisk/extensions.conf
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./config/sip/rtp.conf
        target: /etc/asterisk/rtp.conf
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./config/sip/modules.conf
        target: /etc/asterisk/modules.conf
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./config/sip/logger.conf
        target: /etc/asterisk/logger.conf
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./config/sip/asterisk.conf
        target: /etc/asterisk/asterisk.conf
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./config/secretos/sip_credenciales.conf
        target: /etc/asterisk/secretos/sip_credenciales.conf
        read_only: true
        bind:
          create_host_path: false
    networks:
      ran:
        ipv4_address: 10.53.1.10

  ims-dns:
    profiles:
    - ims
    build: ./docker/ims/dns
    networks:
      ims:
        ipv4_address: 10.53.2.15
    dns:
    - 10.53.2.15
    security_opt:
    - no-new-privileges:true
    cap_drop:
    - ALL
    cap_add:
    - NET_BIND_SERVICE
    volumes:
    - ./config/ims/dns:/config:ro
    healthcheck:
      test:
      - CMD
      - dig
      - '@127.0.0.1'
      - ims.mnc001.mcc001.3gppnetwork.org
      - SOA
      - +short
      interval: 5s
      timeout: 3s
      retries: 30
  ims-mysql:
    profiles:
    - ims
    build: ./docker/ims/mysql
    networks:
      ims:
        ipv4_address: 10.53.2.17
    dns:
    - 10.53.2.15
    security_opt:
    - no-new-privileges:true
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETUID, SETGID]
    env_file:
    - path: ./config/secretos/ims_mysql.env
      required: false
    volumes:
    - ims-mysql-data:/var/lib/mysql
    healthcheck:
      test:
      - CMD-SHELL
      - MYSQL_PWD="$$MYSQL_ROOT_PASSWORD" mysql -uroot -Nse "SELECT 1" >/dev/null
      interval: 5s
      timeout: 3s
      retries: 60
  ims-pyhss:
    profiles:
    - ims
    build: ./docker/ims/pyhss
    networks:
      ims:
        ipv4_address: 10.53.2.18
    dns:
    - 10.53.2.15
    security_opt:
    - no-new-privileges:true
    env_file:
    - path: ./config/secretos/ims_mysql.env
      required: false
    environment:
      MCC: '001'
      MNC: '01'
      MYSQL_IP: 10.53.2.17
      PYHSS_IP: 10.53.2.18
      PYHSS_BIND_PORT: '3868'
    depends_on:
      ims-mysql:
        condition: service_healthy
      ims-dns:
        condition: service_healthy
    cap_drop:
    - ALL
    volumes:
    - ./config/ims/pyhss:/mnt/pyhss:ro
    - ./scripts/provisionar_ims.py:/opt/provisionar_ims.py:ro
    healthcheck:
      test:
      - CMD
      - python3
      - -c
      - import urllib.request; urllib.request.urlopen("http://127.0.0.1:8080/docs/")
      interval: 5s
      timeout: 3s
      retries: 60
  ims-icscf:
    profiles:
    - ims
    build: ./docker/ims/ims_base
    networks:
      ims:
        ipv4_address: 10.53.2.19
    dns:
    - 10.53.2.15
    security_opt:
    - no-new-privileges:true
    env_file:
    - path: ./config/secretos/ims_mysql.env
      required: false
    environment:
      MCC: '001'
      MNC: '01'
      MYSQL_IP: 10.53.2.17
      PYHSS_IP: 10.53.2.18
      PYHSS_BIND_PORT: '3868'
      COMPONENT_NAME: icscf
      ICSCF_IP: 10.53.2.19
      ICSCF_BIND_PORT: '3869'
      PCSCF_PUB_IP: 10.53.2.21
      SCP_IP: 10.53.2.2
      PCRF_BIND_PORT: '3868'
      RTPENGINE_IP: 127.0.0.1
      IMS_N5: ${IMS_N5:-0}
    depends_on:
      ims-mysql:
        condition: service_healthy
      ims-dns:
        condition: service_healthy
      ims-pyhss:
        condition: service_healthy
    cap_drop:
    - ALL
    volumes:
    - ./config/ims/icscf:/mnt/icscf:ro
    - ./docker/ims:/opt/ims:ro
    entrypoint:
    - bash
    - /opt/ims/icscf/init.sh
    command: []
    cap_add: []
    healthcheck:
      test:
      - CMD-SHELL
      - ss -lun | grep -q ':4060 '
      interval: 5s
      timeout: 3s
      retries: 60
  ims-scscf:
    profiles:
    - ims
    build: ./docker/ims/ims_base
    networks:
      ims:
        ipv4_address: 10.53.2.20
    dns:
    - 10.53.2.15
    security_opt:
    - no-new-privileges:true
    env_file:
    - path: ./config/secretos/ims_mysql.env
      required: false
    environment:
      MCC: '001'
      MNC: '01'
      MYSQL_IP: 10.53.2.17
      PYHSS_IP: 10.53.2.18
      PYHSS_BIND_PORT: '3868'
      COMPONENT_NAME: scscf
      SCSCF_IP: 10.53.2.20
      SCSCF_BIND_PORT: '3870'
      PCSCF_PUB_IP: 10.53.2.21
      SCP_IP: 10.53.2.2
      PCRF_BIND_PORT: '3868'
      RTPENGINE_IP: 127.0.0.1
      IMS_N5: ${IMS_N5:-0}
    depends_on:
      ims-mysql:
        condition: service_healthy
      ims-dns:
        condition: service_healthy
      ims-pyhss:
        condition: service_healthy
    cap_drop:
    - ALL
    volumes:
    - ./config/ims/scscf:/mnt/scscf:ro
    - ./docker/ims:/opt/ims:ro
    entrypoint:
    - bash
    - /opt/ims/scscf/init.sh
    command: []
    cap_add: []
    healthcheck:
      test:
      - CMD-SHELL
      - ss -lun | grep -q ':6060 '
      interval: 5s
      timeout: 3s
      retries: 60
  ims-pcscf:
    profiles:
    - ims
    build: ./docker/ims/ims_base
    networks:
      ims:
        ipv4_address: 10.53.2.21
    dns:
    - 10.53.2.15
    security_opt:
    - no-new-privileges:true
    env_file:
    - path: ./config/secretos/ims_mysql.env
      required: false
    environment:
      MCC: '001'
      MNC: '01'
      MYSQL_IP: 10.53.2.17
      PYHSS_IP: 10.53.2.18
      PYHSS_BIND_PORT: '3868'
      COMPONENT_NAME: pcscf
      PCSCF_IP: 10.53.2.21
      PCSCF_BIND_PORT: '3871'
      PCSCF_PUB_IP: 10.53.2.21
      SCP_IP: 10.53.2.2
      PCRF_BIND_PORT: '3868'
      RTPENGINE_IP: 127.0.0.1
      IMS_N5: ${IMS_N5:-0}
    depends_on:
      ims-mysql:
        condition: service_healthy
      ims-dns:
        condition: service_healthy
      ims-pyhss:
        condition: service_healthy
    sysctls:
      net.ipv4.ip_nonlocal_bind: "1"
    cap_drop:
    - ALL
    volumes:
    - ./config/ims/pcscf:/mnt/pcscf:ro
    - ./docker/ims:/opt/ims:ro
    entrypoint:
    - bash
    - /opt/ims/pcscf/init.sh
    command: []
    cap_add:
    - NET_ADMIN
    healthcheck:
      test:
      - CMD-SHELL
      - ss -lun | grep -q ':5060 '
      interval: 5s
      timeout: 3s
      retries: 60

volumes:
  mongodb-data:
  gnb-logs:
  core-logs:
  ims-mysql-data:

# N2 (SCTP/38412) y N3 (UDP/2152) circulan por esta red sin publicar puertos.
# Las configuraciones deben usar estas IP; comprobar que la subred no se superponga con el host.
networks:
  ran:
    driver: bridge
    ipam:
      config:
        - subnet: 10.53.1.0/24
  ims:
    driver: bridge
    ipam:
      config:
        - subnet: 10.53.2.0/24
